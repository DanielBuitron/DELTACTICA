<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070708" />
    <title>Administración | Deltactica</title>
    <meta name="description" content="Panel de administración de Deltactica." />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body data-wa="573000000000">
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <header class="header" data-header>
      <a class="brand" href="index.html"><img src="img/wordmark.png" alt="Deltactica" width="1013" height="100" /></a>
      <a class="nav-item" href="index.html"><span>Volver al sitio</span></a>
    </header>
    <main id="contenido">
      <section class="page">
        <div class="wrap">
          <form class="admin-login contact-form" data-admin-login>
            <p class="eyebrow">Panel</p>
            <h1>Administración</h1>
            <p>Información general, ventas y bodega.</p>
            <label>Clave de acceso<input name="clave" type="password" required autocomplete="current-password"></label>
            <button class="btn btn-metal" type="submit">Entrar</button>
            <p data-admin-error></p>
          </form>
          <div data-admin-shell hidden>
            <header class="page-hero">
              <p class="eyebrow">Panel</p>
              <h1>Administración</h1>
              <p class="admin-note">Los pedidos y la existencia se guardan en este navegador.</p>
            </header>
            <div class="admin-shell">
              <nav class="admin-menu" aria-label="Menús administrativos">
                <a href="#general" data-admin-tab="general">General</a>
                <a href="#ventas" data-admin-tab="ventas">Ventas</a>
                <a href="#bodega" data-admin-tab="bodega">Bodega</a>
              </nav>
              <div>
                <section data-admin-panel="general"></section>
                <section data-admin-panel="ventas" hidden></section>
                <section data-admin-panel="bodega" hidden></section>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/store.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
