<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070708" />
    <title>Administración | Deltactica</title>
    <meta name="description" content="Panel de administración de Deltactica." />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body data-wa="573227043082">
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <header class="header" data-header>
      <a class="brand" href="index.html"><img src="img/wordmark.png" alt="Deltactica" width="1013" height="100" /></a>
      <div class="header-tools is-end">
        <a class="nav-item" href="index.html"><span class="nav-long">Volver al sitio</span><span class="nav-short">Sitio</span></a>
        <div class="account" data-account>
          <button class="account-toggle" type="button" data-account-toggle aria-expanded="false" aria-haspopup="true">
            <span data-account-label>Iniciar sesión</span>
          </button>
          <div class="account-menu" data-account-menu hidden></div>
        </div>
      </div>
    </header>
    <main id="contenido">
      <section class="page">
        <div class="wrap">
          <form class="admin-login contact-form" data-admin-login>
            <p class="eyebrow">Acceso</p>
            <h1>Iniciar sesión</h1>
            <p>Estos son los usuarios de ingreso. Elija uno y entre al panel.</p>
            <div class="user-board" data-user-board></div>
            <label>Usuario
              <select name="usuario" required>
                <option value="direccion">direccion</option>
                <option value="ventas">ventas</option>
                <option value="bodega">bodega</option>
              </select>
            </label>
            <label>Clave<input name="clave" type="password" required autocomplete="current-password"></label>
            <button class="btn btn-metal" type="submit">Entrar</button>
            <p data-admin-error></p>
          </form>
          <div data-admin-shell hidden>
            <header class="page-hero admin-top">
              <div>
                <p class="eyebrow">Panel de control</p>
                <h1>Operación</h1>
                <p class="admin-note" data-admin-who>Los pedidos y la existencia se guardan en este navegador.</p>
              </div>
              <button class="btn btn-ghost" type="button" data-logout>Salir</button>
            </header>
            <div class="admin-shell">
              <nav class="admin-menu" aria-label="Menús administrativos">
                <a href="#general" data-admin-tab="general">General</a>
                <a href="#ventas" data-admin-tab="ventas">Ventas</a>
                <a href="#bodega" data-admin-tab="bodega">Bodega</a>
                <a href="#catalogo" data-admin-tab="catalogo">Descargar catálogo</a>
              </nav>
              <div>
                <section data-admin-panel="general"></section>
                <section data-admin-panel="ventas" hidden></section>
                <section data-admin-panel="bodega" hidden></section>
                <section data-admin-panel="catalogo" hidden></section>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/store.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
