<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PONAL #3, prueba</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #f3f3f3; color: #171717; font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 16px 56px; }
    h1 { font-size: 1.6rem; font-weight: normal; margin: 0 0 8px; }
    p { margin: 0 0 18px; line-height: 1.45; }
    model-viewer { width: 100%; height: 72vh; min-height: 440px; background: #fff; }
    .vistas { display: grid; gap: 18px; margin-top: 28px; }
    figure { margin: 0; background: #fff; }
    img { width: 100%; height: auto; display: block; }
    figcaption { padding: 10px 14px; }
  </style>
</head>
<body>
  <main>
    <h1>PONAL #3, prueba</h1>
    <p>Arrastre el modelo para verlo por todos los lados. Debajo están el frente, la espalda, los dos perfiles y los tres cuartos.</p>
    <model-viewer src="ponal-3.glb?v=2" camera-controls touch-action="pan-y" shadow-intensity="0.35" exposure="1.05" alt="Uniforme PONAL #3 de prueba"></model-viewer>
    <div class="vistas">
      <figure>
        <img src="vistas/frente.png?v=2" alt="Frente del uniforme PONAL #3">
        <figcaption>Frente</figcaption>
      </figure>
      <figure>
        <img src="vistas/espalda.png?v=2" alt="Espalda del uniforme PONAL #3">
        <figcaption>Espalda</figcaption>
      </figure>
      <figure>
        <img src="vistas/perfil-izquierdo.png?v=2" alt="Perfil izquierdo del uniforme PONAL #3">
        <figcaption>Perfil izquierdo</figcaption>
      </figure>
      <figure>
        <img src="vistas/perfil-derecho.png?v=2" alt="Perfil derecho del uniforme PONAL #3">
        <figcaption>Perfil derecho</figcaption>
      </figure>
      <figure>
        <img src="vistas/tres-cuartos.png?v=2" alt="Tres cuartos del uniforme PONAL #3">
        <figcaption>Tres cuartos</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
